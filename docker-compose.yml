version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: hackspiration-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hackspiration
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: deps
    command: sh -c 'export DATABASE_URL=postgresql://postgres:postgres@db:5432/hackspiration && npx prisma db push && npx prisma db seed'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackspiration-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/hackspiration
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - AUTH_SECRET=dev-secret
    depends_on:
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_data: